function speakKo(t,r=0.85){return new Promise(res=>{const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=r;u.onend=res;u.onerror=res;speechSynthesis.speak(u)})}

// ═══ MAIN APP ═══
function App(){
  const[words,setWords]=useState([]);
  const[tab,setTab]=useState("study");
  const[pl,setPl]=useState("all");
  const[dark,setDark]=useState(true);
  const[stats,setStats]=useState({date:td(),studied:0});
  const[ok,setOk]=useState(false);

  useEffect(()=>{
    try{const d=localStorage.getItem('mv-words');setWords(d?JSON.parse(d):DW);}catch{setWords(DW);}
    try{const s=localStorage.getItem('mv-stats');if(s){const p=JSON.parse(s);setStats(p.date===td()?p:{date:td(),studied:0});}}catch{}
    try{const t=localStorage.getItem('mv-theme');if(t)setDark(t==='dark');}catch{}
    setOk(true);
  },[]);

  const sv=useCallback(w=>{setWords(w);localStorage.setItem('mv-words',JSON.stringify(w));},[]);
  const recStudy=useCallback(()=>{setStats(p=>{const n={...p,date:td(),studied:(p.date===td()?p.studied:0)+1};localStorage.setItem('mv-stats',JSON.stringify(n));return n;});},[]);
  const filtered=useMemo(()=>pl==='diff'?words.filter(w=>w.difficult):pl==='fav'?words.filter(w=>w.favorite):words,[words,pl]);
  const uw=(id,d)=>sv(words.map(w=>w.id===id?{...w,...d}:w));
  const aw=w=>sv([...words,{...w,id:uid(),difficult:false,favorite:false}]);
  const ab=l=>sv([...words,...l.map(w=>({...w,id:uid(),difficult:false,favorite:false}))]);
  const dw=id=>sv(words.filter(w=>w.id!==id));
  const ra=()=>sv([]);
  const togTheme=()=>{const n=!dark;setDark(n);localStorage.setItem('mv-theme',n?'dark':'light');};

  if(!ok)return null;

  return <div className={dark?'':'light'}>
    <div className="hdr">
      <h1>My Vocab</h1>
      <div className="hdr-r">
        <span className="badge">{words.length}단어</span>
        <button className="thbtn" onClick={togTheme}>{dark?'☀️':'🌙'}</button>
      </div>
    </div>
    <div className="tabs">
      {[['study','📖','학습'],['audio','🎧','오디오'],['list','📚','단어장'],['stats','📊','통계']].map(([k,i,l])=>
        <button key={k} className={`tab ${tab===k?'on':''}`} onClick={()=>setTab(k)}><span className="ti">{i}</span>{l}</button>
      )}
    </div>
    {(tab==='study'||tab==='audio')&&<div className="pl">
      {[['all','전체'],['diff','🚩 어려운'],['fav','⭐ 즐겨찾기']].map(([k,l])=>
        <button key={k} className={`chip ${pl===k?'on':''}`} onClick={()=>setPl(k)}>
          {l} ({k==='diff'?words.filter(w=>w.difficult).length:k==='fav'?words.filter(w=>w.favorite).length:words.length})
        </button>
      )}
    </div>}
    {tab==='study'&&<StudyV words={filtered} uw={uw} rec={recStudy}/>}
    {tab==='audio'&&<AudioV words={filtered} uw={uw}/>}
    {tab==='list'&&<ListV words={words} aw={aw} ab={ab} uw={uw} dw={dw} ra={ra}/>}
    {tab==='stats'&&<StatsV words={words} stats={stats}/>}
  </div>;
}

// ═══ STUDY ═══
function StudyV({words,uw,rec}){
  const[idx,setIdx]=useState(0);
  const[fl,setFl]=useState(false);
  const[deck,setDeck]=useState(words);
  const[dir,setDir]=useState('wm');
  useEffect(()=>{setDeck(words);setIdx(0);setFl(false);},[words]);
  if(!deck.length)return<div className="empty"><div className="empty-i">📇</div><p>선택한 목록에 단어가 없어요</p></div>;
  const c=deck[Math.min(idx,deck.length-1)];
  if(!c)return null;
  const front=dir==='wm'?c.word:c.meaning,back=dir==='wm'?c.meaning:c.word;
  const fL=dir==='wm'?'단어':'뜻',bL=dir==='wm'?'뜻':'단어';
  const doFlip=()=>{if(!fl)rec();setFl(!fl);};
  const go=d=>{setIdx(i=>Math.max(0,Math.min(deck.length-1,i+d)));setFl(false);};
  return<>
    <div className="dtog">{Iflip}
      <button className={dir==='wm'?'on':''} onClick={()=>{setDir('wm');setFl(false);}}>단어→뜻</button>
      <button className={dir==='mw'?'on':''} onClick={()=>{setDir('mw');setFl(false);}}>뜻→단어</button>
    </div>
    <div className="carea" onClick={doFlip}>
      <div className={`cinner ${fl?'flip':''}`}>
        <div className="cface cf"><div className="ctag">{fL}</div><div className="cmain">{front}</div>
          {!fl&&c.example&&dir==='wm'&&<div className="csub">{c.example}</div>}
          <div className="chint">탭하여 뒤집기</div></div>
        <div className="cface cb"><div className="ctag">{bL}</div><div className="cmain">{back}</div>
          {fl&&c.example&&dir==='mw'&&<div className="csub">{c.example}</div>}</div>
      </div>
    </div>
    <div className="cnav">
      <button className="nb" onClick={()=>go(-1)} disabled={idx===0}>‹</button>
      <span className="nct">{idx+1} / {deck.length}</span>
      <button className="nb" onClick={()=>go(1)} disabled={idx===deck.length-1}>›</button>
    </div>
    <div className="cacts">
      <button className={`abtn ${c.favorite?'os':''}`} onClick={e=>{e.stopPropagation();uw(c.id,{favorite:!c.favorite});c.favorite=!c.favorite;}}>
        {Istar(c.favorite)} 즐겨찾기</button>
      <button className="spkc" onClick={e=>{e.stopPropagation();speak(c.word);}}>{Iv(22)}</button>
      <button className={`abtn ${c.difficult?'of':''}`} onClick={e=>{e.stopPropagation();uw(c.id,{difficult:!c.difficult});c.difficult=!c.difficult;}}>
        {Iflag(c.difficult)} 어려움</button>
    </div>
    <div style={{display:'flex',justifyContent:'center'}}>
      <button className="abtn" onClick={()=>{setDeck(shuf(deck));setIdx(0);setFl(false);}}>{Ishuf} 섞기</button>
    </div>
  </>;
}

// ═══ AUDIO ═══
function AudioV({words,uw}){
  const[playing,setPlaying]=useState(false);
  const[idx,setIdx]=useState(0);
  const[speed,setSpeed]=useState(0.85);
  const[intv,setIntv]=useState(3);
  const[loop,setLoop]=useState(true);
  const[doShuf,setDoShuf]=useState(false);
  const[showM,setShowM]=useState(false);
  const[deck,setDeck]=useState(words);
  const pRef=useRef(false),iRef=useRef(0),dRef=useRef(deck);
  useEffect(()=>{const d=doShuf?shuf(words):[...words];setDeck(d);dRef.current=d;setIdx(0);iRef.current=0;},[words,doShuf]);
  useEffect(()=>{dRef.current=deck;},[deck]);
  const stop=useCallback(()=>{pRef.current=false;speechSynthesis?.cancel();setPlaying(false);},[]);
  const playLoop=useCallback(async si=>{
    pRef.current=true;setPlaying(true);let i=si;
    while(pRef.current){
      const d=dRef.current;if(!d.length){stop();return;}
      if(i>=d.length){if(loop)i=0;else{stop();return;}}
      iRef.current=i;setIdx(i);setShowM(false);
      await speak(d[i].word,speed);if(!pRef.current)return;
      await new Promise(r=>setTimeout(r,800));if(!pRef.current)return;
      setShowM(true);await speakKo(d[i].meaning,speed);if(!pRef.current)return;
      await new Promise(r=>setTimeout(r,intv*1000));if(!pRef.current)return;
      i++;
    }
  },[speed,intv,loop,stop]);
  const togPlay=()=>{if(playing)stop();else playLoop(iRef.current);};
  const goN=()=>{stop();const n=Math.min(idx+1,deck.length-1);setIdx(n);iRef.current=n;setShowM(false);};
  const goP=()=>{stop();const n=Math.max(idx-1,0);setIdx(n);iRef.current=n;setShowM(false);};
  useEffect(()=>()=>{pRef.current=false;speechSynthesis?.cancel();},[]);
  if(!deck.length)return<div className="empty"><div className="empty-i">🎧</div><p>선택한 목록에 단어가 없어요</p></div>;
  const c=deck[idx]||deck[0];
  return<>
    <div className="apanel">
      <div className="anow">
        <div className="anow-tag">{playing?'♫ Now Playing':'Audio Mode'}</div>
        <div className="anow-w">{c.word}</div>
        <div className="anow-m" style={{opacity:showM||!playing?1:.2}}>{showM||!playing?c.meaning:'・・・'}</div>
        {c.example&&<div className="anow-ex">{c.example}</div>}
      </div>
      <div className="actrl">
        <button className="acb" onClick={goP}>{Iprv}</button>
        <button className="acb main" onClick={togPlay}>{playing?Ipause:Iplay}</button>
        <button className="acb" onClick={goN}>{Inxt}</button>
      </div>
      <div className="aslider"><div className="slbl"><span>재생 속도</span><span>{speed.toFixed(2)}x</span></div>
        <input type="range" min="0.5" max="1.2" step="0.05" value={speed} onChange={e=>setSpeed(parseFloat(e.target.value))}/></div>
      <div className="aslider"><div className="slbl"><span>단어 간격</span><span>{intv}초</span></div>
        <input type="range" min="1" max="15" step="1" value={intv} onChange={e=>setIntv(parseInt(e.target.value))}/></div>
      <div className="atogs">
        <button className={`togb ${loop?'on':''}`} onClick={()=>setLoop(!loop)}>{Iloop} 반복</button>
        <button className={`togb ${doShuf?'on':''}`} onClick={()=>setDoShuf(!doShuf)}>{Ishuf} 셔플</button>
      </div>
      <div className="aprog"><div className="apb"><div className="apf" style={{width:`${((idx+1)/deck.length)*100}%`}}/></div>
        <div className="apt">{idx+1} / {deck.length}</div></div>
    </div>
    <div className="cacts">
      <button className={`abtn ${c.favorite?'os':''}`} onClick={()=>{uw(c.id,{favorite:!c.favorite});c.favorite=!c.favorite;}}>{Istar(c.favorite)} 즐겨찾기</button>
      <button className="spkc" onClick={()=>speak(c.word,speed)}>{Iv(22)}</button>
      <button className={`abtn ${c.difficult?'of':''}`} onClick={()=>{uw(c.id,{difficult:!c.difficult});c.difficult=!c.difficult;}}>{Iflag(c.difficult)} 어려움</button>
    </div>
  </>;
}

// ═══ LIST ═══
function ListV({words,aw,ab,uw,dw,ra}){
  const[modal,setModal]=useState(null);
  const[search,setSearch]=useState('');
  const[filter,setFilter]=useState('all');
  const fl=words.filter(w=>{
    const ms=w.word.includes(search)||w.meaning.includes(search);
    if(filter==='diff')return ms&&w.difficult;if(filter==='fav')return ms&&w.favorite;return ms;
  });
  return<>
    <input className="search" placeholder="검색..." value={search} onChange={e=>setSearch(e.target.value)}/>
    <div className="pl">{[['all','전체'],['diff','🚩 어려운'],['fav','⭐ 즐겨찾기']].map(([k,l])=>
      <button key={k} className={`chip ${filter===k?'on':''}`} onClick={()=>setFilter(k)}>
        {l} ({k==='diff'?words.filter(w=>w.difficult).length:k==='fav'?words.filter(w=>w.favorite).length:words.length})</button>
    )}</div>
    {!fl.length?<div className="empty"><div className="empty-i">📚</div><p>{search?'검색 결과 없음':'단어를 추가해보세요'}</p></div>
    :fl.map(w=><div key={w.id} className="wi">
      <div className="wim">
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <span className="wiw">{w.word}</span>
          <div className="wtags">{w.difficult&&<span className="wtag d">어려움</span>}{w.favorite&&<span className="wtag f">★</span>}</div>
        </div>
        <div className="wimn">{w.meaning}</div>
      </div>
      <div style={{display:'flex',gap:2}}>
        <button className="ib" onClick={()=>speak(w.word)} style={{color:'var(--acc)'}}>{Iv(15)}</button>
        <button className="ib" onClick={()=>setModal({edit:w})}>{Iedit}</button>
        <button className="ib" onClick={()=>{if(confirm('삭제?'))dw(w.id)}} style={{color:'var(--red)'}}>{Itrash}</button>
      </div>
    </div>)}
    <div className="fabs">
      <button className="fab fabs2" onClick={()=>setModal('bulk')}>{Ibulk}</button>
      <button className="fab fabp" onClick={()=>setModal('add')}>{Iplus}</button>
    </div>
    {modal==='add'&&<WModal onSave={d=>{aw(d);setModal(null)}} onClose={()=>setModal(null)}/>}
    {modal?.edit&&<WModal initial={modal.edit} onSave={d=>{uw(modal.edit.id,d);setModal(null)}} onClose={()=>setModal(null)}/>}
    {modal==='bulk'&&<BModal words={words} onImport={d=>{ab(d);setModal(null)}} onClose={()=>setModal(null)} ra={ra}/>}
  </>;
}

// ═══ STATS ═══

  const ts=stats.date===td()?stats.studied:0;
  return<>
    <div className="sc"><h3 style={{fontSize:14,color:'var(--acc)',marginBottom:12}}>📊 오늘의 학습</h3>
      <div className="sr"><span className="srl">학습한 카드</span><span className="srv" style={{color:'var(--acc)'}}>{ts}</span></div></div>
    <div className="sc"><h3 style={{fontSize:14,color:'var(--t2)',marginBottom:12}}>📚 단어장 현황</h3>
      <div className="sr"><span className="srl">전체</span><span className="srv">{words.length}</span></div>
      <div className="sr"><span className="srl">🚩 어려운</span><span className="srv" style={{color:'var(--red)'}}>{dc}</span></div>

      <div className="sr"><span className="srl">예문 있음</span><span className="srv" style={{color:'var(--grn)'}}>{ec}</span></div></div>

      <div style={{display:'flex',borderRadius:6,overflow:'hidden',height:24}}>
        <div style={{width:`${(dc/words.length)*100}%`,background:'var(--red)',minWidth:dc?20:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,color:'#fff',fontWeight:600}}>{dc>0&&Math.round((dc/words.length)*100)+'%'}</div>
        <div style={{width:`${(fc/words.length)*100}%`,background:'var(--acc)',minWidth:fc?20:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,color:'#fff',fontWeight:600}}>{fc>0&&Math.round((fc/words.length)*100)+'%'}</div>
        <div style={{flex:1,background:'var(--s3)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,color:'var(--t3)'}}>일반</div>
      </div>
      <div style={{display:'flex',gap:12,marginTop:8,fontSize:11,color:'var(--t3)'}}><span>🟥 어려움</span><span>🟧 즐겨찾기</span><span>⬜ 일반</span></div></div>}
  </>;

// ═══ MODALS ═══
function WModal({initial,onSave,onClose}){
  const[w,sW]=useState(initial?.word||'');
  const[m,sM]=useState(initial?.meaning||'');
  const[ex,sE]=useState(initial?.example||'');
  return<div className="overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
    <div className="mt"><span>{initial?'단어 수정':'새 단어 추가'}</span><button className="ib" onClick={onClose}>{Ix}</button></div>
    <div className="fg"><label className="fl">단어</label><input className="fi" value={w} onChange={e=>sW(e.target.value)} placeholder="お正月" autoFocus/></div>
    <div className="fg"><label className="fl">뜻</label><input className="fi" value={m} onChange={e=>sM(e.target.value)} placeholder="설날"/></div>
    <div className="fg"><label className="fl">예문 (선택)</label><input className="fi" value={ex} onChange={e=>sE(e.target.value)} placeholder="お正月に家族と過ごす。"/></div>
    <div className="fa"><button className="btn bp" style={{flex:1}} onClick={()=>{if(w.trim()&&m.trim())onSave({word:w.trim(),meaning:m.trim(),example:ex.trim()})}}>{initial?'수정':'추가'}</button>
      <button className="btn bg" onClick={onClose}>취소</button></div>
  </div></div>;
}

function BModal({words,onImport,onClose,ra}){
  const[text,setText]=useState('');
  const[sep,setSep]=useState(' - ');
  const parsed=text.trim()?text.trim().split('\n').map(l=>{const i=l.indexOf(sep);if(i===-1)return null;const w=l.slice(0,i).trim(),m=l.slice(i+sep.length).trim();return w&&m?{word:w,meaning:m,example:''}:null}).filter(Boolean):[];
  return<div className="overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
    <div className="mt"><span>📋 대량 입력</span><button className="ib" onClick={onClose}>{Ix}</button></div>
    <div className="fg"><label className="fl">구분자</label><div style={{display:'flex',gap:6}}>
      {[[' - ','하이픈 ( - )'],[' : ','콜론 ( : )'],['\t','탭']].map(([s,l])=>
        <button key={s} className={`chip ${sep===s?'on':''}`} onClick={()=>setSep(s)}>{l}</button>
      )}</div></div>
    <div className="fg"><label className="fl">단어 목록 붙여넣기</label>
      <textarea className="fi" value={text} onChange={e=>setText(e.target.value)} placeholder={"お正月 - 설날\n正体 - 정체\n正す - 바로잡다"}/></div>
    {parsed.length>0&&<><div className="bc">✓ {parsed.length}개 인식</div><div className="bpv">
      {parsed.slice(0,8).map((p,i)=><div key={i} className="bpi"><span style={{fontWeight:600}}>{p.word}</span><span style={{color:'var(--t2)'}}>{p.meaning}</span></div>)}
      {parsed.length>8&&<div style={{textAlign:'center',fontSize:11,color:'var(--t3)',padding:'4px 0'}}>...외 {parsed.length-8}개</div>}
    </div></>}
    <div className="fa"><button className="btn bp" style={{flex:1}} onClick={()=>parsed.length&&onImport(parsed)} disabled={!parsed.length}>{parsed.length?parsed.length+'개 추가':'단어를 입력하세요'}</button>
      <button className="btn bg" onClick={onClose}>취소</button></div>
    <div className="dz"><div className="dzl" style={{color:'var(--acc)'}}>📦 기기 간 동기화</div>
      <button className="btn bg" style={{width:'100%',fontSize:12}} onClick={()=>{
        const t=words.map(w=>w.word+' - '+w.meaning).join('\n');
        navigator.clipboard?.writeText(t).then(()=>alert('📋 복사 완료! 다른 기기에서 붙여넣기하세요.')).catch(()=>alert('복사 실패'));
      }}>📋 전체 단어 클립보드 복사</button></div>
    <div className="dz"><div className="dzl" style={{color:'var(--red)'}}>초기화</div>
      <button className="btn bd" style={{width:'100%'}} onClick={()=>{if(confirm('모든 단어 삭제?')){ra();onClose();}}}>🔄 전체 삭제</button></div>
  </div></div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
