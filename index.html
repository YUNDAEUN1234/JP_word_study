<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0b10">
<title>My Vocab</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0b10;--surface:#16151e;--surface2:#1e1d2a;--surface3:#272636;--border:#2a293a;--text:#eae8f4;--text2:#9a97b0;--text3:#5f5d73;--accent:#8b5cf6;--accent2:#a78bfa;--accent-glow:rgba(139,92,246,.12);--green:#34d399;--green-bg:rgba(52,211,153,.1);--red:#f87171;--red-bg:rgba(248,113,113,.1);--orange:#fbbf24;--orange-bg:rgba(251,191,36,.08);--r:14px;--rs:10px;--f:'DM Sans','Noto Sans JP',sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);font-family:var(--f);color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{max-width:520px;margin:0 auto;padding:env(safe-area-inset-top) 16px 120px;min-height:100dvh}

.header{padding:20px 0 14px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:22px;font-weight:700;background:linear-gradient(135deg,#a78bfa,#8b5cf6,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-count{font-size:12px;color:var(--text3);background:var(--surface);padding:4px 12px;border-radius:20px;border:1px solid var(--border)}

.tabs{display:flex;background:var(--surface);border-radius:12px;padding:3px;margin-bottom:18px;border:1px solid var(--border)}
.tab{flex:1;padding:9px 0;text-align:center;font-size:13px;font-weight:500;color:var(--text3);border:none;background:none;cursor:pointer;border-radius:10px;transition:all .25s;font-family:var(--f)}
.tab.active{background:var(--accent);color:#fff;box-shadow:0 2px 12px rgba(139,92,246,.35)}

.view{display:none}.view.active{display:block}

/* Card */
.card-wrap{perspective:1200px;height:280px;margin-bottom:14px;cursor:pointer;-webkit-user-select:none;user-select:none}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;border:1px solid var(--border)}
.card-front{background:linear-gradient(145deg,var(--surface),var(--surface2));box-shadow:0 8px 32px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.03)}
.card-back{background:linear-gradient(145deg,var(--surface2),var(--surface3));transform:rotateY(180deg);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.card-lbl{font-size:10px;text-transform:uppercase;letter-spacing:2.5px;color:var(--accent2);margin-bottom:10px;font-weight:600}
.card-word{font-size:36px;font-weight:700;text-align:center;line-height:1.3;letter-spacing:1px}
.card-meaning{font-size:24px;font-weight:600;text-align:center;line-height:1.4}
.card-hint{position:absolute;bottom:14px;font-size:10px;color:var(--text3)}

.card-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px}
.nav-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.nav-btn:active{transform:scale(.92)}
.nav-btn:disabled{opacity:.25}
.nav-counter{font-size:13px;color:var(--text2);font-weight:500;min-width:56px;text-align:center}

.card-acts{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px}
.speak-btn{width:50px;height:50px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 18px rgba(139,92,246,.4);transition:all .15s}
.speak-btn:active{transform:scale(.9)}
.star-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--orange);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.star-btn.on{background:var(--orange-bg);border-color:var(--orange)}
.shuf-btn{display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:12px;cursor:pointer;font-family:var(--f)}
.shuf-btn:active{transform:scale(.95)}

.filter-row{display:flex;gap:6px;margin-bottom:12px}
.chip{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:11.5px;font-family:var(--f);cursor:pointer;transition:all .2s}
.chip.on{background:var(--accent-glow);border-color:var(--accent);color:var(--accent2)}

/* Quiz */
.qprog{height:3px;background:var(--surface2);border-radius:2px;margin-bottom:22px;overflow:hidden}
.qprog-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .4s}
.qlabel{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;text-align:center}
.qword{font-size:32px;font-weight:700;margin-bottom:22px;text-align:center;letter-spacing:1px}
.qopts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.qopt{padding:14px 18px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--rs);font-size:15px;color:var(--text);cursor:pointer;transition:all .15s;text-align:left;font-family:var(--f)}
.qopt:active:not(:disabled){transform:scale(.98)}
.qopt.correct{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.qopt.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.qtype-btn{padding:14px;border-radius:var(--rs);border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-size:13px;font-family:var(--f);cursor:pointer;text-align:left;transition:all .2s;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.qtype-btn:active{transform:scale(.98)}
.qtype-emoji{font-size:24px}
.qtype-label{font-weight:600;color:var(--text)}
.qtype-desc{font-size:11px;color:var(--text3);margin-top:1px}

.qresult{text-align:center;padding:28px 16px}
.qscore{font-size:56px;font-weight:800;background:linear-gradient(135deg,var(--green),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.qscore-lbl{font-size:13px;color:var(--text3);margin-bottom:18px}
.qdetail{display:flex;justify-content:center;gap:28px;margin-bottom:20px}
.qdetail-num{font-size:22px;font-weight:700}
.qdetail-lbl{font-size:11px;color:var(--text3);margin-top:2px}

/* Word list */
.search{width:100%;padding:9px 13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:13.5px;font-family:var(--f);outline:none;margin-bottom:10px}
.search:focus{border-color:var(--accent)}
.search::placeholder{color:var(--text3)}

.witem{display:flex;align-items:center;gap:8px;padding:11px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:5px}
.witem-main{flex:1;min-width:0}
.witem-word{font-weight:600;font-size:14.5px;margin-bottom:1px}
.witem-mean{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.witem-acts{display:flex;gap:1px}

.ibtn{width:30px;height:30px;border-radius:7px;border:none;background:transparent;color:var(--text3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.ibtn:active{transform:scale(.85)}
.ibtn.danger:active{color:var(--red)}
.ibtn.spk:active{color:var(--accent2)}

/* FABs */
.fabs{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));right:calc(50% - 244px);display:flex;gap:10px;z-index:50}
@media(max-width:552px){.fabs{right:16px}}
.fab{width:52px;height:52px;border-radius:50%;border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.fab:active{transform:scale(.9)}
.fab-p{background:linear-gradient(135deg,var(--accent),#7c3aed);box-shadow:0 5px 20px rgba(139,92,246,.4)}
.fab-s{background:var(--surface2);border:1px solid var(--border);color:var(--accent2);box-shadow:0 4px 16px rgba(0,0,0,.3)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px 18px 0 0;padding:22px 18px max(28px,env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:85dvh;overflow-y:auto;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-size:18px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.fg{margin-bottom:12px}
.flbl{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;display:block}
.finput{width:100%;padding:11px 13px;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:14px;font-family:var(--f);outline:none}
.finput:focus{border-color:var(--accent)}
.finput::placeholder{color:var(--text3)}
textarea.finput{min-height:180px;resize:vertical;line-height:1.7;font-size:13px}

.btn{padding:11px 20px;border-radius:var(--rs);border:none;font-size:13.5px;font-weight:600;font-family:var(--f);cursor:pointer;transition:all .15s}
.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;box-shadow:0 4px 14px rgba(139,92,246,.3)}
.btn-p:disabled{opacity:.4}
.btn-g{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-d{background:var(--red-bg);color:var(--red);border:1px solid transparent}
.factions{display:flex;gap:8px;margin-top:16px}

.bpreview{background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:10px;margin-top:10px;max-height:160px;overflow-y:auto}
.bpitem{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.bpitem:last-child{border-bottom:none}
.bcount{font-size:12px;color:var(--accent2);margin-top:6px;font-weight:500}

.danger-zone{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.danger-lbl{font-size:11px;color:var(--red);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}

.empty{text-align:center;padding:36px 20px;color:var(--text3)}
.empty-ico{font-size:40px;margin-bottom:8px}
.empty p{font-size:13px;line-height:1.5}
</style>
</head>
<body>

<div class="header">
  <h1>My Vocab</h1>
  <span class="hdr-count" id="wordCount">0개</span>
</div>

<div class="tabs">
  <button class="tab active" data-tab="cards">플래시카드</button>
  <button class="tab" data-tab="quiz">퀴즈</button>
  <button class="tab" data-tab="list">단어장</button>
</div>

<!-- ═══ FLASHCARDS ═══ -->
<div class="view active" id="v-cards">
  <div class="filter-row">
    <button class="chip on" data-cf="all">전체</button>
    <button class="chip" data-cf="starred">⭐ 즐겨찾기</button>
  </div>
  <div class="card-wrap" id="cardWrap">
    <div class="card-inner" id="cardInner">
      <div class="card-face card-front">
        <div class="card-lbl">단어</div>
        <div class="card-word" id="cFrontWord"></div>
        <div class="card-hint">탭하여 뒤집기</div>
      </div>
      <div class="card-face card-back">
        <div class="card-lbl">뜻</div>
        <div class="card-meaning" id="cBackMean"></div>
      </div>
    </div>
  </div>
  <div class="card-nav">
    <button class="nav-btn" id="cPrev">&#10094;</button>
    <span class="nav-counter" id="cCounter">1 / 1</span>
    <button class="nav-btn" id="cNext">&#10095;</button>
  </div>
  <div class="card-acts">
    <button class="star-btn" id="cStar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
    <button class="speak-btn" id="cSpeak"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></button>
    <button class="shuf-btn" id="cShuffle">🔀 섞기</button>
  </div>
  <div class="empty" id="cEmpty" style="display:none"><div class="empty-ico">📇</div><p>단어가 없어요</p></div>
</div>

<!-- ═══ QUIZ ═══ -->
<div class="view" id="v-quiz">
  <div id="quizMenu">
    <p style="color:var(--text2);font-size:13px;margin-bottom:14px;text-align:center">퀴즈 유형을 선택하세요</p>
    <button class="qtype-btn" data-qt="meaning"><div class="qtype-emoji">📖</div><div><div class="qtype-label">뜻 맞추기</div><div class="qtype-desc">단어를 보고 뜻을 고르세요</div></div></button>
    <button class="qtype-btn" data-qt="word"><div class="qtype-emoji">🔤</div><div><div class="qtype-label">단어 맞추기</div><div class="qtype-desc">뜻을 보고 단어를 고르세요</div></div></button>
    <button class="qtype-btn" data-qt="listening"><div class="qtype-emoji">🎧</div><div><div class="qtype-label">듣기 퀴즈</div><div class="qtype-desc">발음을 듣고 뜻을 고르세요</div></div></button>
  </div>
  <div id="quizPlay" style="display:none"></div>
  <div id="quizResult" style="display:none"></div>
  <div class="empty" id="qEmpty" style="display:none"><div class="empty-ico">📝</div><p>퀴즈를 시작하려면<br>최소 4개의 단어가 필요해요</p></div>
</div>

<!-- ═══ WORD LIST ═══ -->
<div class="view" id="v-list">
  <input class="search" id="listSearch" placeholder="단어 검색...">
  <div class="filter-row">
    <button class="chip on" data-lf="all" id="lfAll">전체 (0)</button>
    <button class="chip" data-lf="starred" id="lfStar">⭐ (0)</button>
  </div>
  <div id="listItems"></div>
  <div class="empty" id="lEmpty" style="display:none"><div class="empty-ico">📚</div><p>단어를 추가해보세요</p></div>
  <div class="fabs">
    <button class="fab fab-s" id="fabBulk" title="대량 입력"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></button>
    <button class="fab fab-p" id="fabAdd" title="추가"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
  </div>
</div>

<!-- ═══ MODALS (injected via JS) ═══ -->
<div id="modalRoot"></div>

<script>
// ─── DATA ───

let words = [];
function load() {
  try { const d = localStorage.getItem('myvocab'); words = d ? JSON.parse(d) : [...DEFAULT_WORDS]; }
  catch { words = [...DEFAULT_WORDS]; }
  if (!words.length && !localStorage.getItem('myvocab')) words = [...DEFAULT_WORDS];
  save();
}
function save() {
  localStorage.setItem('myvocab', JSON.stringify(words));
  document.getElementById('wordCount').textContent = words.length + '개';
}

// ─── TTS ───
function speak(text) {
  if (!speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.rate = 0.82;
  speechSynthesis.speak(u);
}

// ─── UTILS ───
function shuffle(a) { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]} return b; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ─── TABS ───
const tabs = document.querySelectorAll('.tab');
const views = document.querySelectorAll('.view');
let currentTab = 'cards';

tabs.forEach(t => t.addEventListener('click', () => {
  currentTab = t.dataset.tab;
  tabs.forEach(x => x.classList.toggle('active', x === t));
  views.forEach(v => v.classList.toggle('active', v.id === 'v-' + currentTab));
  if (currentTab === 'cards') renderCards();
  if (currentTab === 'quiz') renderQuizMenu();
  if (currentTab === 'list') renderList();
}));

// ═══════════════════════════════════════
//  FLASHCARDS
// ═══════════════════════════════════════
let cardIdx = 0, cardFlipped = false, cardFilter = 'all';
let deck = [];

function getFilteredDeck() {
  return cardFilter === 'starred' ? words.filter(w => w.starred) : [...words];
}

function renderCards() {
  deck = getFilteredDeck();
  cardIdx = Math.min(cardIdx, Math.max(0, deck.length - 1));
  cardFlipped = false;

  const hasCards = deck.length > 0;
  document.getElementById('cardWrap').style.display = hasCards ? '' : 'none';
  document.querySelector('.card-nav').style.display = hasCards ? '' : 'none';
  document.querySelector('.card-acts').style.display = hasCards ? '' : 'none';
  document.getElementById('cEmpty').style.display = hasCards ? 'none' : '';
  if (!hasCards) { document.getElementById('cEmpty').querySelector('p').textContent = cardFilter === 'starred' ? '즐겨찾기한 단어가 없어요' : '단어를 추가해주세요'; return; }

  updateCard();
}

function updateCard() {
  const c = deck[cardIdx];
  if (!c) return;
  document.getElementById('cFrontWord').textContent = c.word;
  document.getElementById('cBackMean').textContent = c.meaning;
  document.getElementById('cardInner').classList.toggle('flipped', cardFlipped);
  document.getElementById('cCounter').textContent = (cardIdx + 1) + ' / ' + deck.length;
  document.getElementById('cPrev').disabled = cardIdx === 0;
  document.getElementById('cNext').disabled = cardIdx === deck.length - 1;

  const starBtn = document.getElementById('cStar');
  starBtn.classList.toggle('on', !!c.starred);
  starBtn.querySelector('svg polygon').setAttribute('fill', c.starred ? 'currentColor' : 'none');
}

document.getElementById('cardWrap').addEventListener('click', () => { cardFlipped = !cardFlipped; updateCard(); });
document.getElementById('cPrev').addEventListener('click', e => { e.stopPropagation(); if(cardIdx > 0){cardIdx--;cardFlipped=false;updateCard();} });
document.getElementById('cNext').addEventListener('click', e => { e.stopPropagation(); if(cardIdx < deck.length-1){cardIdx++;cardFlipped=false;updateCard();} });
document.getElementById('cSpeak').addEventListener('click', e => { e.stopPropagation(); if(deck[cardIdx]) speak(deck[cardIdx].word); });
document.getElementById('cStar').addEventListener('click', e => {
  e.stopPropagation();
  if (!deck[cardIdx]) return;
  const w = words.find(x => x.id === deck[cardIdx].id);
  if (w) { w.starred = !w.starred; save(); deck[cardIdx].starred = w.starred; updateCard(); }
});
document.getElementById('cShuffle').addEventListener('click', e => { e.stopPropagation(); deck = shuffle(deck); cardIdx = 0; cardFlipped = false; updateCard(); });

// Card filter chips
document.querySelectorAll('[data-cf]').forEach(c => c.addEventListener('click', () => {
  cardFilter = c.dataset.cf;
  document.querySelectorAll('[data-cf]').forEach(x => x.classList.toggle('on', x === c));
  cardIdx = 0; cardFlipped = false; renderCards();
}));

// Touch swipe for cards
let touchStartX = 0;
document.getElementById('cardWrap').addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
document.getElementById('cardWrap').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 60) {
    if (dx < 0 && cardIdx < deck.length - 1) { cardIdx++; cardFlipped = false; updateCard(); }
    else if (dx > 0 && cardIdx > 0) { cardIdx--; cardFlipped = false; updateCard(); }
  }
}, { passive: true });

// ═══════════════════════════════════════
//  QUIZ
// ═══════════════════════════════════════
let quizType = null, quizQs = [], quizIdx = 0, quizScore = 0, quizSel = null, quizResults = [];

function renderQuizMenu() {
  quizType = null;
  const enough = words.length >= 4;
  document.getElementById('quizMenu').style.display = enough ? '' : 'none';
  document.getElementById('quizPlay').style.display = 'none';
  document.getElementById('quizResult').style.display = 'none';
  document.getElementById('qEmpty').style.display = enough ? 'none' : '';
}

document.querySelectorAll('[data-qt]').forEach(b => b.addEventListener('click', () => startQuiz(b.dataset.qt)));

function startQuiz(type) {
  quizType = type; quizIdx = 0; quizScore = 0; quizSel = null; quizResults = [];
  const shuffled = shuffle(words);
  quizQs = shuffled.slice(0, Math.min(10, words.length)).map(w => {
    const others = shuffle(words.filter(o => o.id !== w.id)).slice(0, 3);
    const isMean = type === 'meaning' || type === 'listening';
    const opts = shuffle([...others.map(p => isMean ? p.meaning : p.word), isMean ? w.meaning : w.word]);
    return { word: w, options: opts, correct: isMean ? w.meaning : w.word };
  });
  document.getElementById('quizMenu').style.display = 'none';
  document.getElementById('quizResult').style.display = 'none';
  renderQuizQ();
}

function renderQuizQ() {
  const el = document.getElementById('quizPlay');
  el.style.display = '';
  const q = quizQs[quizIdx];
  let prompt = '';
  if (quizType === 'listening') {
    prompt = `<div style="text-align:center;margin-bottom:22px"><button class="speak-btn" onclick="speak('${q.word.word.replace(/'/g,"\\'")}')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></button><p style="font-size:12px;color:var(--text3);margin-top:8px">발음을 듣고 뜻을 고르세요</p></div>`;
  } else if (quizType === 'word') {
    prompt = `<div class="qword" style="font-size:22px;font-weight:500">${q.word.meaning}</div>`;
  } else {
    prompt = `<div style="text-align:center;margin-bottom:22px"><div class="qword">${q.word.word}</div><button class="ibtn spk" onclick="speak('${q.word.word.replace(/'/g,"\\'")}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button></div>`;
  }
  el.innerHTML = `
    <div class="qprog"><div class="qprog-bar" style="width:${(quizIdx/quizQs.length)*100}%"></div></div>
    <div class="qlabel">Question ${quizIdx+1} / ${quizQs.length}</div>
    ${prompt}
    <div class="qopts">${q.options.map((o,i) => `<button class="qopt" data-qi="${i}">${o}</button>`).join('')}</div>
  `;
  el.querySelectorAll('.qopt').forEach(b => b.addEventListener('click', () => handleQuizAnswer(b)));
  if (quizType === 'listening') setTimeout(() => speak(q.word.word), 300);
}

function handleQuizAnswer(btn) {
  if (quizSel !== null) return;
  const q = quizQs[quizIdx];
  const chosen = btn.textContent;
  quizSel = chosen;
  const ok = chosen === q.correct;
  if (ok) quizScore++;
  quizResults.push({ ...q, chosen, isCorrect: ok });

  document.querySelectorAll('.qopt').forEach(b => {
    if (b.textContent === q.correct) b.classList.add('correct');
    else if (b === btn && !ok) b.classList.add('wrong');
    b.disabled = true;
  });

  setTimeout(() => {
    quizSel = null;
    if (quizIdx + 1 >= quizQs.length) showQuizResult();
    else { quizIdx++; renderQuizQ(); }
  }, 800);
}

function showQuizResult() {
  document.getElementById('quizPlay').style.display = 'none';
  const el = document.getElementById('quizResult');
  el.style.display = '';
  const pct = Math.round(quizScore / quizQs.length * 100);
  const wrong = quizResults.filter(r => !r.isCorrect);

  let wrongHtml = '';
  if (wrong.length) {
    wrongHtml = `<p style="font-size:12px;color:var(--text3);margin-bottom:8px;text-align:center">틀린 단어</p>` +
      wrong.map(r => `<div class="witem" style="margin-bottom:5px"><div class="witem-main"><div class="witem-word">${r.word.word}</div><div class="witem-mean">${r.word.meaning}</div></div><button class="ibtn spk" onclick="speak('${r.word.word.replace(/'/g,"\\'")}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button></div>`).join('');
  }

  el.innerHTML = `
    <div class="qresult">
      <div class="qscore">${pct}%</div>
      <div class="qscore-lbl">${quizQs.length}문제 중 ${quizScore}개 정답</div>
      <div class="qdetail">
        <div><div class="qdetail-num" style="color:var(--green)">${quizScore}</div><div class="qdetail-lbl">정답</div></div>
        <div><div class="qdetail-num" style="color:var(--red)">${quizQs.length-quizScore}</div><div class="qdetail-lbl">오답</div></div>
      </div>
      <div style="text-align:left;margin-bottom:18px">${wrongHtml}</div>
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="btn btn-p" id="qRetry">다시 풀기</button>
        <button class="btn btn-g" id="qBack">유형 선택</button>
      </div>
    </div>`;
  document.getElementById('qRetry').addEventListener('click', () => startQuiz(quizType));
  document.getElementById('qBack').addEventListener('click', renderQuizMenu);
}

// ═══════════════════════════════════════
//  WORD LIST
// ═══════════════════════════════════════
let listFilter = 'all', listSearch = '';

function renderList() {
  const s = listSearch.toLowerCase();
  let filtered = words.filter(w => {
    const ms = w.word.toLowerCase().includes(s) || w.meaning.includes(s);
    return ms && (listFilter === 'all' || (listFilter === 'starred' && w.starred));
  });

  document.getElementById('lfAll').textContent = '전체 (' + words.length + ')';
  document.getElementById('lfStar').textContent = '⭐ (' + words.filter(w => w.starred).length + ')';

  const el = document.getElementById('listItems');
  document.getElementById('lEmpty').style.display = filtered.length ? 'none' : '';
  document.getElementById('lEmpty').querySelector('p').textContent = s ? '검색 결과가 없어요' : '단어를 추가해보세요';

  if (!filtered.length) { el.innerHTML = ''; return; }

  el.innerHTML = filtered.map(w => `
    <div class="witem" data-id="${w.id}">
      <button class="ibtn" onclick="toggleStar('${w.id}')" style="color:${w.starred?'var(--orange)':'var(--text3)'}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="${w.starred?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      </button>
      <div class="witem-main"><div class="witem-word">${w.word}</div><div class="witem-mean">${w.meaning}</div></div>
      <div class="witem-acts">
        <button class="ibtn spk" onclick="speak('${w.word.replace(/'/g,"\\'")}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
        <button class="ibtn" onclick="openEditModal('${w.id}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="ibtn danger" onclick="deleteWord('${w.id}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
      </div>
    </div>`).join('');
}

document.getElementById('listSearch').addEventListener('input', e => { listSearch = e.target.value; renderList(); });
document.querySelectorAll('[data-lf]').forEach(c => c.addEventListener('click', () => {
  listFilter = c.dataset.lf;
  document.querySelectorAll('[data-lf]').forEach(x => x.classList.toggle('on', x === c));
  renderList();
}));

window.toggleStar = function(id) {
  const w = words.find(x => x.id === id);
  if (w) { w.starred = !w.starred; save(); renderList(); }
};

window.deleteWord = function(id) {
  if (!confirm('삭제할까요?')) return;
  words = words.filter(w => w.id !== id);
  save(); renderList();
};

// ─── MODALS ───
const modalRoot = document.getElementById('modalRoot');

function closeModal() { modalRoot.innerHTML = ''; }

function openAddModal() {
  modalRoot.innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-title"><span>새 단어 추가</span><button class="ibtn" onclick="closeModal()">✕</button></div>
        <div class="fg"><label class="flbl">단어</label><input class="finput" id="mWord" placeholder="お正月"></div>
        <div class="fg"><label class="flbl">뜻</label><input class="finput" id="mMean" placeholder="설날"></div>
        <div class="factions"><button class="btn btn-p" style="flex:1" onclick="doAdd()">추가</button><button class="btn btn-g" onclick="closeModal()">취소</button></div>
      </div>
    </div>`;
  document.getElementById('mWord').focus();
  document.getElementById('mMean').addEventListener('keydown', e => { if(e.key==='Enter') doAdd(); });
}

window.doAdd = function() {
  const w = document.getElementById('mWord').value.trim();
  const m = document.getElementById('mMean').value.trim();
  if (!w || !m) return;
  words.push({ id: uid(), word: w, meaning: m });
  save(); closeModal(); renderList();
};

window.openEditModal = function(id) {
  const item = words.find(w => w.id === id);
  if (!item) return;
  modalRoot.innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-title"><span>단어 수정</span><button class="ibtn" onclick="closeModal()">✕</button></div>
        <div class="fg"><label class="flbl">단어</label><input class="finput" id="mWord" value="${item.word.replace(/"/g,'&quot;')}"></div>
        <div class="fg"><label class="flbl">뜻</label><input class="finput" id="mMean" value="${item.meaning.replace(/"/g,'&quot;')}"></div>
        <div class="factions"><button class="btn btn-p" style="flex:1" onclick="doEdit('${id}')">수정</button><button class="btn btn-g" onclick="closeModal()">취소</button></div>
      </div>
    </div>`;
};

window.doEdit = function(id) {
  const w = document.getElementById('mWord').value.trim();
  const m = document.getElementById('mMean').value.trim();
  if (!w || !m) return;
  const item = words.find(x => x.id === id);
  if (item) { item.word = w; item.meaning = m; save(); closeModal(); renderList(); }
};

function openBulkModal() {
  modalRoot.innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-title"><span>📋 대량 입력</span><button class="ibtn" onclick="closeModal()">✕</button></div>
        <div class="fg">
          <label class="flbl">구분자</label>
          <div class="filter-row">
            <button class="chip on" onclick="setSep(' - ',this)">하이픈 ( - )</button>
            <button class="chip" onclick="setSep(' : ',this)">콜론 ( : )</button>
            <button class="chip" onclick="setSep('\\t',this)">탭</button>
          </div>
        </div>
        <div class="fg">
          <label class="flbl">단어 목록 붙여넣기</label>
          <textarea class="finput" id="bulkText" placeholder="お正月 - 설날&#10;正体 - 정체&#10;正す - 바로잡다"></textarea>
        </div>
        <div id="bulkPreview"></div>
        <div class="factions"><button class="btn btn-p" style="flex:1" id="bulkBtn" disabled onclick="doBulk()">단어를 입력하세요</button><button class="btn btn-g" onclick="closeModal()">취소</button></div>
        <div class="danger-zone">
          <div class="danger-lbl">초기화</div>
          <button class="btn btn-d" style="width:100%" onclick="if(confirm('모든 단어를 삭제할까요?')){words=[];save();closeModal();renderList()}">🔄 전체 단어 삭제</button>
        </div>
      </div>
    </div>`;
  document.getElementById('bulkText').addEventListener('input', updateBulkPreview);
}

let bulkSep = ' - ';
window.setSep = function(s, btn) {
  bulkSep = s;
  btn.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  btn.classList.add('on');
  updateBulkPreview();
};

function parseBulk() {
  const text = document.getElementById('bulkText')?.value?.trim();
  if (!text) return [];
  return text.split('\n').map(line => {
    const i = line.indexOf(bulkSep);
    if (i === -1) return null;
    const word = line.slice(0, i).trim();
    const meaning = line.slice(i + bulkSep.length).trim();
    return word && meaning ? { word, meaning } : null;
  }).filter(Boolean);
}

function updateBulkPreview() {
  const parsed = parseBulk();
  const prev = document.getElementById('bulkPreview');
  const btn = document.getElementById('bulkBtn');
  if (!parsed.length) {
    prev.innerHTML = '';
    btn.disabled = true;
    btn.textContent = '단어를 입력하세요';
    return;
  }
  btn.disabled = false;
  btn.textContent = parsed.length + '개 추가하기';
  prev.innerHTML = `<div class="bcount">✓ ${parsed.length}개 단어 인식됨</div><div class="bpreview">${parsed.slice(0,10).map(p=>`<div class="bpitem"><span style="font-weight:600">${p.word}</span><span style="color:var(--text2)">${p.meaning}</span></div>`).join('')}${parsed.length>10?`<div style="text-align:center;font-size:12px;color:var(--text3);padding:6px 0">...외 ${parsed.length-10}개</div>`:''}</div>`;
}

window.doBulk = function() {
  const parsed = parseBulk();
  if (!parsed.length) return;
  parsed.forEach(p => words.push({ id: uid(), word: p.word, meaning: p.meaning }));
  save(); closeModal(); renderList();
};

document.getElementById('fabAdd').addEventListener('click', openAddModal);
document.getElementById('fabBulk').addEventListener('click', openBulkModal);

// ─── INIT ───
load();
renderCards();
</script>
</body>
</html>
